  write-to-system: false
  server: ntp.aliyun.com
  port: 123
  interval: 60
tun:
  enable: true
  stack: mixed
  auto-route: true
  strict-route: true
  auto-redirect: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
    - tcp://any:53
proxies:
