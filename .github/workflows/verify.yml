name: Verify full overrides
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - name: Update the script SHA identifier
        run: node tools/script-sha.js --update
      - name: Generate the CDN script copy
        run: node tools/build-cdn-script.js
      - name: Generate static YAML and CDN copy from repository sources
        run: npm run build
      - run: npm test
      - run: npm run check
      - name: Download and verify pinned Mihomo
        run: |
          read -r URL SHA256 <<EOF
          $(node -e 'const l = require("./tools/mihomo.lock.json"), s = l.platforms["linux-x64"]; console.log(`${l.release}/${s.archive} ${s.sha256}`);')
          EOF
          curl -fsSL --retry 3 "$URL" -o /tmp/mihomo.gz
          printf '%s  /tmp/mihomo.gz\n' "$SHA256" | sha256sum -c -
          gzip -d /tmp/mihomo.gz
          chmod +x /tmp/mihomo
      - name: Check current public rules and isolated routing
        run: |
          node tools/download-rules.js .local/rules
          node tools/native-check.js /tmp/mihomo .local/rules
